name: "Anchore SBOM Action / Download Syft"
description: "Downloads Syft to the Action tool cache and provides a reference"
author: "Anchore"

inputs:
  run:
    required: true
    description: "The action to run"
    default: "download-syft"
    type: "choice"
    options: ["download-syft"]

  syft-version:
    required: false
    description: "The version of Syft to download"

  syft-download-retry-count:
    required: false
    description: "Number of times to retry transient Syft download failures"
    default: "3"

  syft-download-retry-delay:
    required: false
    description: "Seconds to wait between Syft download retry attempts"
    default: "5"

outputs:
  cmd:
    description: "A reference to the Syft command"

runs:
  using: "node24"
  main: "../dist/index.cjs"
